name: Deploy PRODUCTION to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'migrations/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/deploy-production.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production-deploy
  cancel-in-progress: false

jobs:
  deploy-production:
    name: Validate and deploy PRODUCTION
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_PRODUCTION_D1_DATABASE_ID }}
      PRODUCTION_D1_DATABASE_NAME: school-of-nursing-faq-bot-prod-db
      PRODUCTION_WORKER_NAME: school-of-nursing-faq-bot

    steps:
      - name: Checkout main source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify production credentials
        shell: bash
        run: |
          test "${GITHUB_REF}" = "refs/heads/main" || { echo "Production deploys are allowed from main only."; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing GitHub secret: CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing GitHub secret: CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$PRODUCTION_D1_DATABASE_ID" || { echo "Missing GitHub secret: CLOUDFLARE_PRODUCTION_D1_DATABASE_ID"; exit 1; }

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build isolated production Wrangler config
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const source = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          fs.writeFileSync('.wrangler.production.generated.json', JSON.stringify({
            $schema: source.$schema,
            name: process.env.PRODUCTION_WORKER_NAME,
            main: source.main,
            compatibility_date: source.compatibility_date,
            workers_dev: true,
            preview_urls: false,
            vars: { APP_ENV: 'production' },
            d1_databases: [{
              binding: 'DB',
              database_name: process.env.PRODUCTION_D1_DATABASE_NAME,
              database_id: process.env.PRODUCTION_D1_DATABASE_ID,
              migrations_dir: 'migrations'
            }]
          }, null, 2));
          NODE

      - name: Validate D1 migrations locally
        run: npx wrangler d1 migrations apply DB --local --config .wrangler.production.generated.json

      - name: Validate production Worker bundle
        run: npx wrangler deploy --dry-run --config .wrangler.production.generated.json --outdir dist-deploy-production

      - name: Apply production D1 migrations
        run: npx wrangler d1 migrations apply DB --remote --config .wrangler.production.generated.json

      - name: Deploy production Worker
        run: npx wrangler deploy --config .wrangler.production.generated.json --var "APP_ENV:production" --var "DEPLOY_REVISION:${GITHUB_SHA}"

      - name: Inspect production binding names
        shell: bash
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          settings="$(curl --fail --silent --show-error --connect-timeout 10 --max-time 20 \
            "${api}/workers/scripts/${PRODUCTION_WORKER_NAME}/settings" -H "$auth")"
          node -e '
            const p=JSON.parse(process.argv[1]);
            if(p.success!==true) process.exit(1);
            const bindings=Array.isArray(p.result?.bindings)?p.result.bindings:[];
            const rows=bindings.map(b=>({name:b.name,type:b.type}));
            console.log("Production binding names/types:", JSON.stringify(rows));
            const names=new Set(rows.map(r=>r.name));
            const required=["DB","TELEGRAM_BOT_TOKEN","BOT_OWNER_TELEGRAM_ID"];
            const missing=required.filter(x=>!names.has(x));
            if(missing.length){
              console.error("Missing required production bindings:", missing.join(", "));
              process.exit(1);
            }
          ' "$settings"

      - name: Resolve production origin
        id: worker_endpoint
        shell: bash
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          account_payload="$(curl --fail --silent --show-error --connect-timeout 10 --max-time 20 "${api}/workers/subdomain" -H "$auth")"
          worker_payload="$(curl --fail --silent --show-error --connect-timeout 10 --max-time 20 "${api}/workers/scripts/${PRODUCTION_WORKER_NAME}/subdomain" -H "$auth")"
          account_subdomain="$(node -e 'const p=JSON.parse(process.argv[1]); if(p.success!==true||!p.result?.subdomain)process.exit(1); process.stdout.write(p.result.subdomain)' "$account_payload")"
          worker_enabled="$(node -e 'const p=JSON.parse(process.argv[1]); if(p.success!==true)process.exit(1); process.stdout.write(String(p.result?.enabled===true))' "$worker_payload")"
          test "$worker_enabled" = "true" || { echo "Worker workers.dev route is not enabled."; exit 1; }
          origin="https://${PRODUCTION_WORKER_NAME}.${account_subdomain}.workers.dev"
          echo "origin=$origin" >> "$GITHUB_OUTPUT"

      - name: Verify production health
        shell: bash
        env:
          PRODUCTION_ORIGIN: ${{ steps.worker_endpoint.outputs.origin }}
        run: |
          response="$(curl --fail --silent --show-error --connect-timeout 10 --max-time 30 --retry 5 --retry-delay 2 "${PRODUCTION_ORIGIN}/health")"
          echo "$response"
          node -e 'const b=JSON.parse(process.argv[1]); if(b.ok!==true||b.environment!=="production")process.exit(1)' "$response"

      - name: Arm one-time Owner command verification nonce
        shell: bash
        run: |
          NONCE="$(node -e "process.stdout.write(require('crypto').randomBytes(32).toString('hex'))")"
          echo "::add-mask::$NONCE"
          echo "OPS_NONCE=$NONCE" >> "$GITHUB_ENV"
          payload="$(node -e 'process.stdout.write(JSON.stringify({sql:`INSERT INTO bot_settings (setting_key, setting_value, updated_by, updated_at) VALUES (\"owner_command_resync_nonce\", ?1, 0, CURRENT_TIMESTAMP) ON CONFLICT(setting_key) DO UPDATE SET setting_value=excluded.setting_value, updated_by=0, updated_at=CURRENT_TIMESTAMP`,params:[process.argv[1]]}))' "$NONCE")"
          response="$(curl --fail --silent --show-error --connect-timeout 10 --max-time 30 -X POST \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" --data "$payload" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${PRODUCTION_D1_DATABASE_ID}/query")"
          node -e 'const b=JSON.parse(process.argv[1]); if(b.success!==true){console.error(b);process.exit(1)}' "$response"

      - name: Verify Owner command registry through Telegram read-back
        shell: bash
        env:
          PRODUCTION_ORIGIN: ${{ steps.worker_endpoint.outputs.origin }}
        run: |
          body_file="$(mktemp)"
          status="$(curl --silent --show-error --connect-timeout 10 --max-time 45 -o "$body_file" -w '%{http_code}' -X POST \
            -H "X-Ops-Nonce: ${OPS_NONCE}" \
            "${PRODUCTION_ORIGIN}/ops/telegram/owner-command-resync")"
          response="$(cat "$body_file")"
          rm -f "$body_file"
          echo "Owner command endpoint HTTP ${status}"
          echo "$response"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Owner command endpoint returned non-success HTTP status."
            exit 1
          fi
          node -e '
            const b=JSON.parse(process.argv[1]);
            const expected=["start","whoami","admin","admins","faq","adminmanual","sudo","ai","staff","ownermanual","cancel","reset"];
            if(b.ok!==true||b.environment!=="production"||b.command_count!==12||JSON.stringify(b.owner_commands)!==JSON.stringify(expected)){
              console.error("Owner command verification failed", b); process.exit(1);
            }
          ' "$response"

      - name: Remove generated production config
        if: always()
        run: rm -f .wrangler.production.generated.json

      - name: Deployment summary
        if: success()
        run: |
          {
            echo "## PRODUCTION deployment"
            echo ""
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Source: \`main\`"
            echo "- Validation: PASS"
            echo "- Production D1 migrations: PASS"
            echo "- Worker deploy: PASS"
            echo "- Production health: PASS"
            echo "- Required runtime bindings: PASS"
            echo "- Owner command setMyCommands: PASS"
            echo "- Owner command getMyCommands read-back: PASS (12/12)"
            echo "- TEST pipeline: none"
          } >> "$GITHUB_STEP_SUMMARY"
