# Main-only production pipeline. Touching this file intentionally triggers a production validation/deploy run.
# Telegram bot-token rotations are completed by an automatic nonce-gated webhook cutover.
# Manual production rerun: AI_CONFIG_MASTER_KEY rotated in Cloudflare on 2026-08-18.
# Deployment change-summary verification rerun: 2026-08-18.
# Spam-protection checkpoint: Owner registry now contains 19 commands.
name: Deploy PRODUCTION to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'migrations/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/deploy-production.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production-deploy
  cancel-in-progress: false

jobs:
  deploy-production:
    name: Validate and deploy PRODUCTION
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_PRODUCTION_D1_DATABASE_ID }}
      PRODUCTION_D1_DATABASE_NAME: school-of-nursing-faq-bot-prod-db
      PRODUCTION_WORKER_NAME: school-of-nursing-faq-bot

    steps:
      - name: Checkout main source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify production credentials
        shell: bash
        run: |
          test "${GITHUB_REF}" = "refs/heads/main" || { echo "Production deploys are allowed from main only."; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing GitHub secret: CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing GitHub secret: CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$PRODUCTION_D1_DATABASE_ID" || { echo "Missing GitHub secret: CLOUDFLARE_PRODUCTION_D1_DATABASE_ID"; exit 1; }

      - name: Preflight production runtime bindings
        shell: bash
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          settings="$(curl --fail --silent --show-error --connect-timeout 10 --max-time 20 \
            "${api}/workers/scripts/${PRODUCTION_WORKER_NAME}/settings" -H "$auth")"
          node -e '
            const p=JSON.parse(process.argv[1]);
            if(p.success!==true) process.exit(1);
            const bindings=Array.isArray(p.result?.bindings)?p.result.bindings:[];
            const rows=bindings.map(b=>({name:b.name,type:b.type}));
            console.log("Pre-deploy production bindings:", JSON.stringify(rows));
            const byName=new Map(rows.map(r=>[r.name,r.type]));
            const requirements={DB:"d1",TELEGRAM_BOT_TOKEN:"secret_text",TELEGRAM_WEBHOOK_SECRET:"secret_text",AI_CONFIG_MASTER_KEY:"secret_text",BOT_OWNER_TELEGRAM_ID:"secret_text"};
            const problems=[];
            for(const [name,type] of Object.entries(requirements)){
              if(!byName.has(name)) problems.push(`${name} is missing`);
              else if(byName.get(name)!==type) problems.push(`${name} must be ${type}, found ${byName.get(name)}`);
            }
            if(problems.length){console.error("Production runtime binding preflight failed:", problems.join("; "));process.exit(1);}
          ' "$settings"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build isolated production Wrangler config
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const source = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          fs.writeFileSync('.wrangler.production.generated.json', JSON.stringify({
            $schema: source.$schema,
            name: process.env.PRODUCTION_WORKER_NAME,
            main: source.main,
            compatibility_date: source.compatibility_date,
            workers_dev: true,
            preview_urls: false,
            vars: { APP_ENV: 'production' },
            triggers: source.triggers,
            d1_databases: [{binding:'DB',database_name:process.env.PRODUCTION_D1_DATABASE_NAME,database_id:process.env.PRODUCTION_D1_DATABASE_ID,migrations_dir:'migrations'}]
          }, null, 2));
          NODE

      - name: Validate D1 migrations locally
        run: npx wrangler d1 migrations apply DB --local --config .wrangler.production.generated.json

      - name: Validate production Worker bundle
        run: npx wrangler deploy --dry-run --config .wrangler.production.generated.json --outdir dist-deploy-production

      - name: Apply production D1 migrations
        run: npx wrangler d1 migrations apply DB --remote --config .wrangler.production.generated.json

      - name: Prepare deployment change metadata
        shell: bash
        run: |
          DEPLOY_CHANGE="$(git log -1 --pretty=%s "$GITHUB_SHA" | tr '\r\n' ' ' | cut -c1-180)"
          echo "DEPLOY_CHANGE=$DEPLOY_CHANGE" >> "$GITHUB_ENV"
          echo "Deployment change: $DEPLOY_CHANGE"

      - name: Deploy production Worker
        run: npx wrangler deploy --config .wrangler.production.generated.json --var "APP_ENV:production" --var "DEPLOY_REVISION:${GITHUB_SHA}" --var "DEPLOY_CHANGE:${DEPLOY_CHANGE}"

      - name: Verify production bindings after deploy
        shell: bash
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          settings="$(curl --fail --silent --show-error --connect-timeout 10 --max-time 20 "${api}/workers/scripts/${PRODUCTION_WORKER_NAME}/settings" -H "$auth")"
          node -e '
            const p=JSON.parse(process.argv[1]); if(p.success!==true) process.exit(1);
            const bindings=Array.isArray(p.result?.bindings)?p.result.bindings:[]; const byName=new Map(bindings.map(b=>[b.name,b.type]));
            const required=["DB","TELEGRAM_BOT_TOKEN","TELEGRAM_WEBHOOK_SECRET","AI_CONFIG_MASTER_KEY","BOT_OWNER_TELEGRAM_ID"];
            const missing=required.filter(x=>!byName.has(x)); if(missing.length) process.exit(1);
            if(byName.get("BOT_OWNER_TELEGRAM_ID")!=="secret_text") process.exit(1);
          ' "$settings"

      - name: Resolve production origin
        id: worker_endpoint
        shell: bash
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          account_payload="$(curl --fail --silent --show-error --connect-timeout 10 --max-time 20 "${api}/workers/subdomain" -H "$auth")"
          worker_payload="$(curl --fail --silent --show-error --connect-timeout 10 --max-time 20 "${api}/workers/scripts/${PRODUCTION_WORKER_NAME}/subdomain" -H "$auth")"
          account_subdomain="$(node -e 'const p=JSON.parse(process.argv[1]); if(p.success!==true||!p.result?.subdomain)process.exit(1); process.stdout.write(p.result.subdomain)' "$account_payload")"
          worker_enabled="$(node -e 'const p=JSON.parse(process.argv[1]); if(p.success!==true)process.exit(1); process.stdout.write(String(p.result?.enabled===true))' "$worker_payload")"
          test "$worker_enabled" = "true" || exit 1
          echo "origin=https://${PRODUCTION_WORKER_NAME}.${account_subdomain}.workers.dev" >> "$GITHUB_OUTPUT"

      - name: Verify production health
        shell: bash
        env:
          PRODUCTION_ORIGIN: ${{ steps.worker_endpoint.outputs.origin }}
        run: |
          response="$(curl --fail --silent --show-error --connect-timeout 10 --max-time 30 --retry 5 --retry-delay 2 "${PRODUCTION_ORIGIN}/health")"
          echo "$response"
          node -e 'const b=JSON.parse(process.argv[1]); if(b.ok!==true||b.environment!=="production")process.exit(1)' "$response"

      - name: Arm one-time Telegram webhook cutover nonce
        shell: bash
        run: |
          CUTOVER_NONCE="$(node -e "process.stdout.write(require('crypto').randomBytes(32).toString('hex'))")"
          echo "::add-mask::$CUTOVER_NONCE"
          echo "CUTOVER_NONCE=$CUTOVER_NONCE" >> "$GITHUB_ENV"
          payload="$(node -e 'process.stdout.write(JSON.stringify({sql:`INSERT INTO bot_settings (setting_key, setting_value, updated_by, updated_at) VALUES (\"telegram_cutover_nonce\", ?1, 0, CURRENT_TIMESTAMP) ON CONFLICT(setting_key) DO UPDATE SET setting_value=excluded.setting_value, updated_by=0, updated_at=CURRENT_TIMESTAMP`,params:[process.argv[1]]}))' "$CUTOVER_NONCE")"
          response="$(curl --fail --silent --show-error --connect-timeout 10 --max-time 30 -X POST -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" --data "$payload" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${PRODUCTION_D1_DATABASE_ID}/query")"
          node -e 'const b=JSON.parse(process.argv[1]); if(b.success!==true)process.exit(1)' "$response"

      - name: Cut over and verify Telegram webhook
        shell: bash
        env:
          PRODUCTION_ORIGIN: ${{ steps.worker_endpoint.outputs.origin }}
        run: |
          body_file="$(mktemp)"
          status="$(curl --silent --show-error --connect-timeout 10 --max-time 45 -o "$body_file" -w '%{http_code}' -X POST -H "X-Cutover-Nonce: ${CUTOVER_NONCE}" "${PRODUCTION_ORIGIN}/ops/telegram/cutover")"
          response="$(cat "$body_file")"; rm -f "$body_file"; echo "$response"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then exit 1; fi
          node -e 'const b=JSON.parse(process.argv[1]); if(b.ok!==true||b.environment!=="production"||!String(b.webhook_url||"").endsWith("/telegram/webhook"))process.exit(1)' "$response"

      - name: Arm one-time Owner command verification nonce
        shell: bash
        run: |
          NONCE="$(node -e "process.stdout.write(require('crypto').randomBytes(32).toString('hex'))")"
          echo "::add-mask::$NONCE"
          echo "OPS_NONCE=$NONCE" >> "$GITHUB_ENV"
          payload="$(node -e 'process.stdout.write(JSON.stringify({sql:`INSERT INTO bot_settings (setting_key, setting_value, updated_by, updated_at) VALUES (\"owner_command_resync_nonce\", ?1, 0, CURRENT_TIMESTAMP) ON CONFLICT(setting_key) DO UPDATE SET setting_value=excluded.setting_value, updated_by=0, updated_at=CURRENT_TIMESTAMP`,params:[process.argv[1]]}))' "$NONCE")"
          response="$(curl --fail --silent --show-error --connect-timeout 10 --max-time 30 -X POST -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" --data "$payload" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${PRODUCTION_D1_DATABASE_ID}/query")"
          node -e 'const b=JSON.parse(process.argv[1]); if(b.success!==true)process.exit(1)' "$response"

      - name: Verify Owner command registry through Telegram read-back
        shell: bash
        env:
          PRODUCTION_ORIGIN: ${{ steps.worker_endpoint.outputs.origin }}
        run: |
          body_file="$(mktemp)"
          status="$(curl --silent --show-error --connect-timeout 10 --max-time 45 -o "$body_file" -w '%{http_code}' -X POST -H "X-Ops-Nonce: ${OPS_NONCE}" "${PRODUCTION_ORIGIN}/ops/telegram/owner-command-resync")"
          response="$(cat "$body_file")"; rm -f "$body_file"; echo "$response"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then exit 1; fi
          node -e '
            const b=JSON.parse(process.argv[1]);
            const expected=["start","language","whoami","admin","admins","faq","cases","limits","adminmanual","noti","available","unavailable","sudo","ai","staff","clearmessage","ownermanual","cancel","reset"];
            if(b.ok!==true||b.environment!=="production"||b.command_count!==19||JSON.stringify(b.owner_commands)!==JSON.stringify(expected)) process.exit(1);
          ' "$response"

      - name: Remove generated production config
        if: always()
        run: rm -f .wrangler.production.generated.json

      - name: Deployment summary
        if: success()
        run: |
          {
            echo "## PRODUCTION deployment"
            echo ""
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Change: ${DEPLOY_CHANGE}"
            echo "- Source: \`main\`"
            echo "- Validation: PASS"
            echo "- Production D1 migrations: PASS"
            echo "- Worker deploy: PASS"
            echo "- Production health: PASS"
            echo "- Runtime secrets preserved: PASS"
            echo "- Telegram webhook cutover/read-back: PASS"
            echo "- Owner command setMyCommands: PASS"
            echo "- Owner command getMyCommands read-back: PASS (19/19)"
            echo "- Cron triggers copied from canonical Wrangler config: PASS"
            echo "- TEST pipeline: none"
          } >> "$GITHUB_STEP_SUMMARY"
