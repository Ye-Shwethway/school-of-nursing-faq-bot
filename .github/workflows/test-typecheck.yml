name: Test Build

on:
  push:
    branches: [test]
    paths:
      - 'src/**'
      - 'migrations/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/test-typecheck.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - name: Validate D1 migrations locally
        run: npx wrangler d1 migrations apply school-of-nursing-faq-bot-db --local --env test
      - name: Wrangler dry-run bundle
        run: npx wrangler deploy --dry-run --env test --outdir dist
      - name: Prepare validated deployment artifact
        shell: bash
        run: |
          BUNDLE="$(find dist -type f -name '*.js' | head -n 1)"
          if [ -z "$BUNDLE" ]; then
            echo "No generated JavaScript bundle found in dist/."
            find dist -maxdepth 3 -type f -print || true
            exit 1
          fi
          echo "Using generated bundle: $BUNDLE"
          mkdir -p handoff
          cp "$BUNDLE" handoff/worker.mjs
          sha256sum handoff/worker.mjs > handoff/worker.sha256
      - name: Publish Cloudflare handoff bundle
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-test-handoff
          if-no-files-found: error
          retention-days: 7
          path: |
            migrations/*.sql
            handoff/worker.mjs
            handoff/worker.sha256
