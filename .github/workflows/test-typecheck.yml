name: Test Build

on:
  push:
    branches: [test]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - name: Wrangler dry-run bundle
        run: npx wrangler deploy --dry-run --env test --outdir dist
      - name: Refresh deployment artifact
        run: |
          BUNDLE="$(find dist -type f -name '*.js' | head -n 1)"
          if [ -z "$BUNDLE" ]; then
            echo "No generated JavaScript bundle found in dist/."
            find dist -maxdepth 3 -type f -print || true
            exit 1
          fi
          echo "Using generated bundle: $BUNDLE"
          cp "$BUNDLE" deploy/worker.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- deploy/worker.mjs; then
            echo "Deployment artifact is already current."
            exit 0
          fi
          git add deploy/worker.mjs
          git commit -m "build: refresh validated Worker artifact [skip ci]"
          git push origin HEAD:test
