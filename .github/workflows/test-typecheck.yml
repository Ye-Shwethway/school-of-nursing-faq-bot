name: Test Build

on:
  push:
    branches: [test]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - name: Validate D1 migrations locally
        run: npx wrangler d1 migrations apply school-of-nursing-faq-bot-db --local --env test
      - name: Wrangler dry-run bundle
        run: npx wrangler deploy --dry-run --env test --outdir dist
      - name: Refresh deployment artifact
        run: |
          BUNDLE="$(find dist -type f -name '*.js' | head -n 1)"
          if [ -z "$BUNDLE" ]; then
            echo "No generated JavaScript bundle found in dist/."
            find dist -maxdepth 3 -type f -print || true
            exit 1
          fi
          echo "Using generated bundle: $BUNDLE"
          cp "$BUNDLE" deploy/worker.mjs
          sha256sum deploy/worker.mjs > deploy/worker.sha256
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain -- deploy/worker.mjs deploy/worker.sha256)" ]; then
            echo "Deployment artifact and checksum are already current."
          else
            git add deploy/worker.mjs deploy/worker.sha256
            git commit -m "build: refresh validated Worker artifact [skip ci]"
            git push origin HEAD:test
          fi
      - name: Publish Cloudflare handoff bundle
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-test-handoff
          if-no-files-found: error
          retention-days: 7
          path: |
            migrations/0002_ai_settings.sql
            migrations/0003_handoff_persona.sql
            migrations/0004_shadow_monitoring.sql
            migrations/0005_dynamic_faq.sql
            deploy/worker.mjs
            deploy/worker.sha256
