name: Deploy TEST to Cloudflare

on:
  push:
    branches: [test]
    paths:
      - 'src/**'
      - 'migrations/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'tsconfig.json'
      - '.github/workflows/deploy-test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-test-deploy
  cancel-in-progress: false

jobs:
  deploy-test:
    name: Validate and deploy TEST
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout test source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify deployment credentials exist
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing GitHub secret: CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing GitHub secret: CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Validate D1 migrations locally
        run: npx wrangler d1 migrations apply school-of-nursing-faq-bot-db --local --env test

      - name: Validate Wrangler bundle
        run: npx wrangler deploy --dry-run --env test --outdir dist-deploy-test

      - name: Apply remote D1 migrations
        run: npx wrangler d1 migrations apply school-of-nursing-faq-bot-db --remote --env test

      - name: Deploy TEST Worker
        run: npx wrangler deploy --env test --var "APP_ENV:test" --var "DEPLOY_REVISION:${GITHUB_SHA}"

      - name: Verify TEST health and trigger online notice
        shell: bash
        run: |
          HEALTH_URL="https://school-of-nursing-faq-bot-test.ye-shwethway13.workers.dev/health"
          echo "Checking $HEALTH_URL"
          response="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 "$HEALTH_URL")"
          echo "$response"
          node -e '
            const body = JSON.parse(process.argv[1]);
            if (body.ok !== true || body.environment !== "test") {
              console.error("Unexpected TEST health response", body);
              process.exit(1);
            }
          ' "$response"

      - name: Deployment summary
        if: success()
        run: |
          {
            echo "## Cloudflare TEST deployment"
            echo ""
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Branch: \`test\`"
            echo "- Worker: \`school-of-nursing-faq-bot-test\`"
            echo "- Local validation: PASS"
            echo "- D1 migrations: applied before deploy"
            echo "- Health: PASS"
            echo "- Owner/Admin online notice: triggered once for this revision"
            echo "- Production Worker: untouched by this workflow"
          } >> "$GITHUB_STEP_SUMMARY"
